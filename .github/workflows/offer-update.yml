name: Offer update to existing installs

# Second step of a release, started by hand from the Actions tab after the
# workflow "Release". Adds the version to updates.xml, adds its changes to
# changelog.xml (the Changelog button in Joomla's update list) and commits that
# to main.
#
# Starting this workflow is the moment every site with the package sees the
# update in Joomla, so only start it after you have tested the zip.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to offer, for example 5.0.0 (empty = newest release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  offer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the package from the release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            tag="v$INPUT_VERSION"
          else
            tag=$(gh release view --json tagName --jq .tagName)
          fi
          version="${tag#v}"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [ "$draft" = "true" ]; then
            echo "::error::Release $tag is still a draft. Publish it first, otherwise sites cannot download it."; exit 1
          fi
          mkdir -p dist
          gh release download "$tag" --pattern "pkg_cbmodulecontent-$version.zip" --dir dist
          sha=$(sha256sum "dist/pkg_cbmodulecontent-$version.zip" | cut -c1-64)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Add the version to the update files
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          node tools/release.js update-xml "$VERSION" --sha256 "$SHA256"
          sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
          xmllint --noout updates.xml changelog.xml
          rm -rf dist

      - name: Commit to main
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.xml changelog.xml
          git commit -m "Offer version $VERSION to existing installs"
          git push origin HEAD:main
          {
            echo "### Version $VERSION is offered"
            echo
            echo "Every site with the package now sees it under System, Update, Extensions."
            echo
            echo "- Download: https://github.com/${{ github.repository }}/releases/download/v$VERSION/pkg_cbmodulecontent-$VERSION.zip"
            echo "- sha256: \`${{ steps.release.outputs.sha256 }}\`"
            echo
            echo 'Sites with only the separate module or plugin (before 5.0.0) look in the old repositories, see "Separate installs" in README.md.'
          } >> "$GITHUB_STEP_SUMMARY"
